{% extends "base.html" %}
{% block title %}Verificación MFA{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Verificación en dos pasos</h1>
    <p class="hint">Ingresa el código de 6 dígitos de tu app de autenticación.</p>
    {% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}
    <form method="post" action="/mfa-verify">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="code">Código</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus>
        <button type="submit">Verificar</button>
    </form>
</div>
{% endblock %}
